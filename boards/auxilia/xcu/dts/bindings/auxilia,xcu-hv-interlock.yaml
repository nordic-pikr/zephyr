# SPDX-License-Identifier: Apache-2.0

description: XCU high voltage interlock.

compatible: "auxilia,xcu-hv-interlock"

include: base.yaml

properties:
  close-gpios:
    type: phandle-array
    required: true
    description: HV interlock close output (CLOSE_HV_INTL).

  closed-gpios:
    type: phandle-array
    required: true
    description: HV interlock closed input (HV_INTL_CLOSED).
